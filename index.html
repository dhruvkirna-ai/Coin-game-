<script>

let time = 30;
let round = 1006;
let coins = 100;

const timer = document.getElementById("timer");
const number = document.getElementById("number");
const message = document.getElementById("message");
const coin = document.getElementById("coin");
const historyBody = document.querySelector("#historyTable tbody");

function randomMessage(num){

    if(num % 2 === 0){
        return "🟢 Even Lucky Number";
    }

    return "🔴 Odd Lucky Number";
}

function addHistory(num){

    const row = historyBody.insertRow(0);

    row.insertCell(0).innerText = round++;
    row.insertCell(1).innerText = num;
    row.insertCell(2).innerText = "Completed";

    while(historyBody.rows.length > 10){
        historyBody.deleteRow(historyBody.rows.length-1);
    }

}

function nextRound(){

    const lucky = Math.floor(Math.random()*10);

    number.innerText = lucky;
    message.innerText = randomMessage(lucky);

    number.classList.remove("animate");
    void number.offsetWidth;
    number.classList.add("animate");

    coins += 2;     // Demo only
    coin.innerText = coins;

    addHistory(lucky);

}


// Number Ball Highlight
const balls = document.querySelectorAll(".ball");

function highlightBall(num){

    balls.forEach(ball=>{
        ball.style.boxShadow="0 5px 15px rgba(0,0,0,.25)";
        ball.style.transform="scale(1)";
    });

    balls[num].style.boxShadow="0 0 25px gold";
    balls[num].style.transform="scale(1.15)";
}

// Ball Click Effect (Demo)
balls.forEach(ball=>{

    ball.addEventListener("click",function(){

        let value=parseInt(this.innerText);

        number.innerText=value;
        message.innerText="👆 Demo Preview : "+value;

        highlightBall(value);

    });

});

// पुराने nextRound() को अपडेट करें
const oldNextRound = nextRound;

nextRound = function(){

    oldNextRound();

    const value = parseInt(number.innerText);

    highlightBall(value);

};

</script>
